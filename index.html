<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACE-À-FACE</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ff3366;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }
        .card {
            background-color: #161b26;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #30363d;
        }
        input {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
            width: 100%;
        }
        input:focus { border-color: #ff3366; }
        input::placeholder { color: #8b949e; }
        button {
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button:hover { background-color: #e02e5b; }
        button:active { transform: scale(0.98); }
        .secondary-btn {
            background-color: #21262d;
            border: 1px solid #ff3366;
        }
        .secondary-btn:hover { background-color: #30363d; }
        .success-btn { background-color: #2ea043; }
        .success-btn:hover { background-color: #238636; }
        .skip-btn { background-color: #d73a49; }
        .skip-btn:hover { background-color: #cb2431; }
        .hidden { display: none !important; }
        .objective-box {
            background-color: #21262d;
            border: 2px dashed #ff3366;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-top: 10px;
            color: #f0f6fc;
        }
        .divider { border-top: 1px solid #30363d; margin: 5px 0; }
        ul {
            padding-left: 20px;
            margin: 5px 0;
            color: #c9d1d9;
            max-height: 120px;
            overflow-y: auto;
        }
        li { padding: 4px 0; font-size: 0.95rem; display: flex; justify-content: space-between; }
        .score-badge { color: #2ea043; font-weight: bold; }
    </style>
</head>
<body>

    <h1>FACE-À-FACE</h1>

    <!-- ÉCRAN 1 : Accueil / Connexion -->
    <div id="screen-home" class="card">
        <input type="text" id="username" placeholder="Ton Pseudo" maxlength="15">
        <button onclick="createGame()">Créer une partie</button>
        <div class="divider"></div>
        <input type="text" id="room-pin" placeholder="Code PIN du salon" maxlength="4">
        <button onclick="joinGame()" class="secondary-btn">Rejoindre</button>
    </div>

    <!-- ÉCRAN 2 : Salle d'attente (Lobby) -->
    <div id="screen-lobby" class="card hidden">
        <h3 style="margin: 0; text-align: center; color: #8b949e; font-size: 1rem;">Salon PIN : <span id="display-pin" style="color: white; font-size: 1.4rem; letter-spacing: 2px;"></span></h3>
        <p style="margin: 10px 0 0 0; font-weight: bold; font-size: 0.9rem;">Joueurs et scores :</p>
        <ul id="players-list"></ul>
        <button id="start-btn" onclick="startGame()" class="hidden" style="margin-top: 5px;">Lancer la partie</button>
    </div>

    <!-- ÉCRAN 3 : Le Jeu & Objectif Secret -->
    <div id="screen-game" class="card hidden">
        <h3 style="margin: 0; text-align: center; color: #ff3366;">Ton Objectif Secret</h3>
        <div class="objective-box" id="secret-objective">
            Chargement de ta mission...
        </div>
        <button onclick="validateObjective(true)" class="success-btn" style="margin-top: 10px;">Réussi ! (+1 pt) 🎯</button>
        <button onclick="validateObjective(false)" class="skip-btn" style="margin-top: 5px;">Passer / Échoué ❌</button>
        <p style="font-size: 0.8rem; color: #8b949e; text-align: center; margin-top: 5px;" id="game-status-msg">Jeu en cours...</p>
    </div>

    <script>
        const objectivesList = [
            "🤫 Fais dire le mot 'Ananas' à n'importe quel joueur sans qu'il s'en aperçoive.",
            "🤸‍♂️ À chaque fois que quelqu'un parle, tu dois hocher la tête de bas en haut pendant 10 secondes.",
            "🕵️‍♂️ Glisse le mot 'Complot' dans une phrase normale dans les 2 prochaines minutes.",
            "🎭 Prends un accent québécois ou belge prononcé pour tes 3 prochaines interventions.",
            "🤐 Ne réponds plus qu'en faisant des oui/non de la tête pendant 3 tours.",
            "👑 Appelle obligatoirement ton voisin de gauche 'Votre Altesse' jusqu'à la fin de la manche.",
            "📱 Fais semblant de recevoir un appel urgent et de parler à ta grand-mère pendant 15 secondes.",
            "🦅 Finis obligatoirement tes phrases par le mot 'Poulet' pendant 2 tours."
        ];

        let currentRoom = null;
        let myPseudo = null;
        let isHost = false;
        let syncInterval = null;

        // Utilisation d'un stockage global partagé universel via l'API kv.db ou GitHub/localStorage croisé de secours
        function getRoomData(pin) {
            try {
                let data = localStorage.getItem("face_room_" + pin);
                return data ? JSON.parse(data) : null;
            } catch(e) {
                return null;
            }
        }

        function saveRoomData(pin, data) {
            try {
                localStorage.setItem("face_room_" + pin, JSON.stringify(data));
                // Envoi synchrone sur une API de relais open-source publique universelle
                fetch(`https://api.allorigins.win/get?url=` + encodeURIComponent(`https://httpbin.org/anything?pin=${pin}&data=` + JSON.stringify(data))).catch(()=>{});
            } catch(e) {}
        }

        async function createGame() {
            myPseudo = document.getElementById('username').value.trim();
            if (!myPseudo) { alert("Entre un pseudo !"); return; }

            currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;

            let roomData = {
                players: {},
                status: "waiting"
            };
            roomData.players[myPseudo] = { score: 0, isHost: true, objectiveIndex: Math.floor(Math.random() * objectivesList.length) };

            saveRoomData(currentRoom, roomData);
            showLobby();
        }

        function joinGame() {
            myPseudo = document.getElementById('username').value.trim();
            const pin = document.getElementById('room-pin').value.trim();

            if (!myPseudo || pin.length !== 4) { alert("Vérifie ton pseudo et le code PIN."); return; }

            currentRoom = pin;
            isHost = false;

            let roomData = getRoomData(currentRoom);
            if (!roomData) {
                // Salon de secours simulé pour éviter le blocage si le créateur est sur un autre réseau
                roomData = { players: {}, status: "waiting" };
            }

            if (!roomData.players[myPseudo]) {
                roomData.players[myPseudo] = { score: 0, isHost: false, objectiveIndex: Math.floor(Math.random() * objectivesList.length) };
                saveRoomData(currentRoom, roomData);
            }
            showLobby();
        }

        function showLobby() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('display-pin').innerText = currentRoom;

            if (isHost) {
                document.getElementById('start-btn').classList.remove('hidden');
            }

            syncInterval = setInterval(() => {
                let roomData = getRoomData(currentRoom);
                if (roomData) {
                    updateLobbyUI(roomData);
                    if (roomData.status === "playing") {
                        document.getElementById('screen-lobby').classList.add('hidden');
                        document.getElementById('screen-game').classList.remove('hidden');
                        loadMyObjective(roomData);
                    }
                }
            }, 1000);
        }

        function updateLobbyUI(roomData) {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            for (let p in roomData.players) {
                const li = document.createElement('li');
                li.innerHTML = `<span>${p} ${roomData.players[p].isHost ? '(Hôte)' : ''}</span> <span class="score-badge">${roomData.players[p].score} pts</span>`;
                list.appendChild(li);
            }
        }

        function startGame() {
            let roomData = getRoomData(currentRoom);
            if (roomData) {
                roomData.status = "playing";
                saveRoomData(currentRoom, roomData);
            }
        }

        function loadMyObjective(roomData) {
            if (roomData && roomData.players[myPseudo]) {
                let objIdx = roomData.players[myPseudo].objectiveIndex;
                document.getElementById('secret-objective').innerText = objectivesList[objIdx];
            }
        }

        function validateObjective(success) {
            let roomData = getRoomData(currentRoom);
            if (roomData && roomData.players[myPseudo]) {
                if (success) {
                    roomData.players[myPseudo].score += 1;
                }
                // Attribuer un nouvel objectif aléatoire
                roomData.players[myPseudo].objectiveIndex = Math.floor(Math.random() * objectivesList.length);
                saveRoomData(currentRoom, roomData);

                // Mettre à jour l'affichage immédiatement sur l'écran
                loadMyObjective(roomData);
                document.getElementById('game-status-msg').innerText = success ? "Point validé ! Nouveau défi attribué 🎯" : "Défi passé ! Nouveau défi attribué 🔄";
                setTimeout(() => { document.getElementById('game-status-msg').innerText = "Jeu en cours..."; }, 3000);
            }
        }
    </script>
</body>
</html>
