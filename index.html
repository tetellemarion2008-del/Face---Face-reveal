<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACE-À-FACE</title>
    <!-- Importation de Firebase pour la synchro parfaite PC / Téléphone -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ff3366;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }
        .card {
            background-color: #161b26;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #30363d;
        }
        input, select {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            text-align: center;
            width: 100%;
        }
        input:focus, select:focus { border-color: #ff3366; }
        input::placeholder { color: #8b949e; }
        button {
            background-color: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button:hover { background-color: #e02e5b; }
        button:active { transform: scale(0.98); }
        .secondary-btn { background-color: #21262d; border: 1px solid #ff3366; }
        .secondary-btn:hover { background-color: #30363d; }
        .success-btn { background-color: #2ea043; }
        .success-btn:hover { background-color: #238636; }
        .fail-btn { background-color: #d73a49; }
        .fail-btn:hover { background-color: #cb2431; }
        .mask-section {
            background-color: #21262d;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .hidden { display: none !important; }
        .objective-box {
            background-color: #21262d;
            border: 2px dashed #ff3366;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1rem;
            line-height: 1.4;
            color: #f0f6fc;
        }
        .divider { border-top: 1px solid #30363d; margin: 5px 0; }
        ul {
            padding-left: 20px;
            margin: 5px 0;
            color: #c9d1d9;
            max-height: 100px;
            overflow-y: auto;
        }
        li { padding: 3px 0; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .score-badge { color: #2ea043; font-weight: bold; }
    </style>
</head>
<body>

    <h1>FACE-À-FACE</h1>

    <!-- ÉCRAN 1 : Accueil / Connexion -->
    <div id="screen-home" class="card">
        <input type="text" id="username" placeholder="Ton Pseudo" maxlength="15">
        <button onclick="createGame()">Créer une partie</button>
        <div class="divider"></div>
        <input type="text" id="room-pin" placeholder="Code PIN du salon" maxlength="4">
        <button onclick="joinGame()" class="secondary-btn">Rejoindre</button>
    </div>

    <!-- ÉCRAN 2 : Salle d'attente (Lobby) -->
    <div id="screen-lobby" class="card hidden">
        <h3 style="margin: 0; text-align: center; color: #8b949e; font-size: 1rem;">Salon PIN : <span id="display-pin" style="color: white; font-size: 1.3rem; letter-spacing: 2px;"></span></h3>
        <p style="margin: 5px 0 0 0; font-weight: bold; font-size: 0.85rem;">Joueurs et scores :</p>
        <ul id="players-list"></ul>
        <button id="start-btn" onclick="startGame()" class="hidden" style="margin-top: 5px;">Lancer la partie</button>
    </div>

    <!-- ÉCRAN 3 : Le Jeu & Objectif Secret -->
    <div id="screen-game" class="card hidden">
        <h3 style="margin: 0; text-align: center; color: #ff3366; font-size: 1.1rem;">Ton Objectif Secret</h3>
        <div class="objective-box" id="secret-objective">
            Chargement...
        </div>
        
        <div style="display: flex; gap: 8px;">
            <button onclick="validateObjective(true)" class="success-btn" style="padding: 10px; font-size: 0.9rem;">Réussi (+1)</button>
            <button onclick="validateObjective(false)" class="fail-btn" style="padding: 10px; font-size: 0.9rem;">Échoué (-1)</button>
        </div>

        <!-- Section Démasquer -->
        <div class="mask-section">
            <span style="font-size: 0.85rem; font-weight: bold; color: #ff3366; text-align: center;">J'ai démasqué quelqu'un ! 🕵️‍♂️</span>
            <select id="target-player-select">
                <option value="">-- Choisir un joueur --</option>
            </select>
            <button onclick="exposePlayer()" class="secondary-btn" style="padding: 8px; font-size: 0.85rem;">Valider le piège (+1 pt / -1 pt)</button>
        </div>

        <p style="font-size: 0.75rem; color: #8b949e; text-align: center; margin: 0;" id="game-status-msg">En jeu...</p>
    </div>

    <script>
        // Configuration Firebase publique open-source pour relier instantanément PC et Téléphone
        const firebaseConfig = {
            databaseURL: "https://face-a-face-default-rtdb.europe-west1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const objectivesList = [
            "🤫 Fais dire le mot 'Ananas' à n'importe quel joueur sans qu'il s'en aperçoive.",
            "🤸‍♂️ À chaque fois que quelqu'un parle, tu dois hocher la tête de bas en haut pendant 10 secondes.",
            "🕵️‍♂️ Glisse le mot 'Complot' dans une phrase normale dans les 2 prochaines minutes.",
            "🎭 Prends un accent québécois ou belge prononcé pour tes 3 prochaines interventions.",
            "🤐 Ne réponds plus qu'en faisant des oui/non de la tête pendant 3 tours.",
            "👑 Appelle obligatoirement ton voisin de gauche 'Votre Altesse' jusqu'à la fin de la manche.",
            "📱 Fais semblant de recevoir un appel urgent et de parler à ta grand-mère pendant 15 secondes.",
            "🦅 Finis obligatoirement tes phrases par le mot 'Poulet' pendant 2 tours."
        ];

        let currentRoom = null;
        let myPseudo = null;
        let isHost = false;

        function createGame() {
            myPseudo = document.getElementById('username').value.trim();
            if (!myPseudo) { alert("Entre un pseudo !"); return; }

            currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;

            db.ref('rooms/' + currentRoom).set({
                status: 'waiting',
                host: myPseudo
            });

            db.ref(`rooms/${currentRoom}/players/${myPseudo}`).set({
                score: 0,
                objectiveIndex: Math.floor(Math.random() * objectivesList.length)
            });

            listenRoom();
            showLobby();
        }

        function joinGame() {
            myPseudo = document.getElementById('username').value.trim();
            const pin = document.getElementById('room-pin').value.trim();

            if (!myPseudo || pin.length !== 4) { alert("Vérifie ton pseudo et le code PIN."); return; }

            currentRoom = pin;
            isHost = false;

            db.ref('rooms/' + currentRoom).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    db.ref(`rooms/${currentRoom}/players/${myPseudo}`).set({
                        score: 0,
                        objectiveIndex: Math.floor(Math.random() * objectivesList.length)
                    });
                    listenRoom();
                    showLobby();
                } else {
                    alert("Ce salon n'existe pas ! Vérifie le code PIN.");
                }
            });
        }

        function showLobby() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-lobby').classList.remove('hidden');
            document.getElementById('display-pin').innerText = currentRoom;

            if (isHost) {
                document.getElementById('start-btn').classList.remove('hidden');
            }
        }

        function listenRoom() {
            // Écoute en temps réel des joueurs et des scores
            db.ref('rooms/' + currentRoom + '/players').on('value', (snapshot) => {
                const list = document.getElementById('players-list');
                const select = document.getElementById('target-player-select');
                list.innerHTML = '';
                select.innerHTML = '<option value="">-- Choisir un joueur --</option>';

                snapshot.forEach((childSnapshot) => {
                    const playerName = childSnapshot.key;
                    const playerData = childSnapshot.val();

                    // Liste affichée dans le lobby
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${playerName} ${playerName === myPseudo ? '(Moi)' : ''}</span> <span class="score-badge">${playerData.score} pts</span>`;
                    list.appendChild(li);

                    // Remplir le menu déroulant pour démasquer (s'il ne s'agit pas de soi-même)
                    if (playerName !== myPseudo) {
                        const opt = document.createElement('option');
                        opt.value = playerName;
                        opt.innerText = playerName;
                        select.appendChild(opt);
                    }
                });
            });

            // Écoute du lancement de la partie
            db.ref('rooms/' + currentRoom + '/status').on('value', (snapshot) => {
                if (snapshot.val() === 'playing') {
                    document.getElementById('screen-home').classList.add('hidden');
                    document.getElementById('screen-lobby').classList.add('hidden');
                    document.getElementById('screen-game').classList.remove('hidden');
                    loadMyObjective();
                }
            });
        }

        function startGame() {
            db.ref('rooms/' + currentRoom + '/status').set('playing');
        }

        function loadMyObjective() {
            db.ref(`rooms/${currentRoom}/players/${myPseudo}/objectiveIndex`).once('value', (snapshot) => {
                const idx = snapshot.val() || 0;
                document.getElementById('secret-objective').innerText = objectivesList[idx];
            });
        }

        async function validateObjective(success) {
            const playerRef = db.ref(`rooms/${currentRoom}/players/${myPseudo}`);
            playerRef.once('value', async (snapshot) => {
                let data = snapshot.val();
                if (success) {
                    data.score += 1;
                } else {
                    data.score -= 1;
                }
                // Changer d'objectif
                data.objectiveIndex = Math.floor(Math.random() * objectivesList.length);
                
                await playerRef.set(data);
                loadMyObjective();
                
                document.getElementById('game-status-msg').innerText = success ? "Objectif réussi ! (+1 pt) 🎯" : "Objectif échoué (-1 pt) ❌";
                setTimeout(() => { document.getElementById('game-status-msg').innerText = "En jeu..."; }, 2500);
            });
        }

        async function exposePlayer() {
            const target = document.getElementById('target-player-select').value;
            if (!target) { alert("Sélectionne un joueur à démasquer !"); return; }

            // Incrémenter mon score et décrémenter celui de la cible
            const myRef = db.ref(`rooms/${currentRoom}/players/${myPseudo}/score`);
            const targetRef = db.ref(`rooms/${currentRoom}/players/${target}/score`);

            await db.ref(`rooms/${currentRoom}/players`).once('value', async (snapshot) => {
                const players = snapshot.val();
                let myNewScore = (players[myPseudo].score || 0) + 1;
                let targetNewScore = (players[target].score || 0) - 1;

                await db.ref(`rooms/${currentRoom}/players/${myPseudo}`).update({ score: myNewScore });
                await db.ref(`rooms/${currentRoom}/players/${target}`).update({ score: targetNewScore });

                alert(`Bien joué ! Tu as démasqué ${target}. Tu gagnes 1 point et il en perd 1 ! 🕵️‍♂️`);
                document.getElementById('target-player-select').value = "";
            });
        }
    </script>
</body>
</html>
